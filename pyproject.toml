[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "turning-movement-counter"
version = "0.1.0"
description = "Windows desktop tool that turns intersection video into turning movement counts with YOLO and ByteTrack"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-or-later" }
dependencies = [
    "numpy>=1.26",
    "PySide6>=6.6",
    "ultralytics>=8.3",
    "lap>=0.5.12",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pyinstaller>=6.6"]

[project.scripts]
turning-movement-counter = "turning_movement_counter.ui.main_window:main"

[tool.setuptools.packages.find]
include = ["turning_movement_counter*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
